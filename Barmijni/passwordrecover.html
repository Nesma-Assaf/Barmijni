<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برمجني</title>
    <!-- ربط مكتبة Font Awesome لأيقونات المتصفح -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ربط ملف CSS الرئيسي للموقع -->
    <link rel="stylesheet" href="style.css"/>
    <!-- ربط ملف CSS الخاص بنماذج التسجيل والدخول -->
    <link rel="stylesheet" href="usersAuthStyle.css"/>
</head>
<body>
<!-- قسم الرأس (HEADER) - يحتوي على شعار الموقع والقائمة الرئيسية -->
<header class="header">
    <!-- زر "سجل الآن" يؤدي إلى صفحة التسجيل -->
    <div class="nav-btn">
        <a href="register.html" class="btn-register">سجل الآن</a>
    </div>
    <!-- شريط القائمة الرئيسية للموقع -->
    <div class="container">
        <nav class="navbar">
            <ul>
                <li><a href="index.html"><img src="images/courses/home.png" alt="home" class="nav-icon"> الرئيسية</a></li>
                <li><a href="paths.html">مسارات</a></li>
                <li><a href="courses.html">دورات</a></li>
                <li><a href="articles.html">مقالات</a></li>
                <li><a href="books.html">كتب</a></li>
            </ul>
        </nav>
    </div>
    <!-- شعار برمجني -->
    <div class="logo">
        <img src="images/icons/لوجو برمجني 2.svg" alt="برمجني">
    </div>
</header>

<!-- قسم استعادة كلمة المرور (PASSWORD RECOVERY SECTION) -->
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-box">
            <!-- عنوان الصفحة مع أيقونة القفل -->
            <h2 class="auth-title">
                <i class="fas fa-lock"></i> استعادة كلمة المرور
            </h2>
            
            <!-- نموذج استعادة كلمة المرور -->
            <form class="auth-form">
                <!-- حقل البريد الإلكتروني - مطلوب للتحقق من الهوية -->
                <div class="form-group">
                    <input 
                        type="email" 
                        class="form-input" 
                        placeholder="البريد الإلكتروني *" 
                        required
                    >
                </div>
                
                <!-- زر التحقق من البريد الإلكتروني -->
                <button type="submit" class="auth-btn">تحقق من البريد</button>
            </form>
            
            <!-- رابط العودة إلى صفحة تسجيل الدخول -->
            <div class="auth-footer">
                <p><a href="login.html" class="forgot-password">الرجوع إلى تسجيل الدخول</a></p>
            </div>
        </div>
    </div>
</section>





<!-- قسم التذييل (FOOTER) - يحتوي على معلومات الموقع والشبكات الاجتماعية -->
<footer class="main-footer">
    <div class="footer-container">
        <!-- قسم الشعار في التذييل -->
        <div class="footer-logo-section">
            <img src="images/icons/لوجو برمجني 2.svg" alt="لوجو برمجني" class="footer-logo">
        </div>

        <!-- قسم المحتوى والشبكات الاجتماعية في التذييل -->
        <div class="footer-content-section">
            <h3 class="footer-title">هدف الموقع</h3>
            <p class="footer-description">
                برمجني هو موقع تعليمي مجاني يهتم بعلوم الكمبيوتر و يقدم إليك المعرفة بشكل مبسّط و مفصّل، 
                و هو المكان المناسب لأي شخص يطمح بأن يصبح مبرمجاً محترفاً و مبدعاً في العالم الرقمي.
            </p>
            
            <!-- روابط الشبكات الاجتماعية -->
            <div class="social-icons">
                <a href="#" class="icon-link"><img src="images/icons/email.svg" alt="Email"></a>
                <a href="#" class="icon-link"><img src="images/icons/youtube-9.svg" alt="YouTube"></a>
                <a href="#" class="icon-link"><img src="images/icons/telegram-4.svg" alt="Telegram"></a>
                <a href="#" class="icon-link"><img src="images/icons/facebook-4.svg" alt="Facebook"></a>
                <a href="#" class="icon-link"><img src="images/icons/whatsapp-4.svg" alt="WhatsApp"></a>
            </div>
        </div>

    </div>
</footer>

<!-- سكريبت JavaScript لوظائف الصفحة -->
<script>
    // التعامل مع إرسال نموذج استعادة كلمة المرور
    document.querySelector('.auth-form').addEventListener('submit', function(e) {
        e.preventDefault(); // منع السلوك الافتراضي للنموذج
        
        // الحصول على قيمة البريد الإلكتروني المدخل
        const email = this.querySelector('.form-input').value;
        
        // التحقق من صحة البريد الإلكتروني
        if (email.trim() !== '') {
            // عرض رسالة تأكيد للمستخدم
            alert(`تم إرسال رابط استعادة كلمة المرور إلى: ${email}\nيرجى التحقق من بريدك الإلكتروني.`);
        } else {
            // عرض رسالة خطأ إذا كان الحقل فارغاً
            alert('يرجى إدخال البريد الإلكتروني');
        }
    });
</script>
</body>
</html>
